<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dual Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D arena; HUD pinned to the corners; menus are a left-aligned panel over the live scene */
  --night:#0b1020; --ink:#141b33; --chalk:#f4f1e8; --mute:#9aa3c0;
  --hoops:#8a6bff; --boots:#ff5466; --court:#f08a35; --pitch:#35c274; --flare:#ffd23f;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--chalk);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,label:focus-within{outline:3px solid var(--flare);outline-offset:3px}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#hud>*{position:absolute}
#score{top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:2px;
  font-family:var(--display);filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.team{display:flex;align-items:center;gap:8px;padding:4px 12px;background:rgba(11,16,32,.82);min-width:112px}
.team.l{border-radius:10px 0 0 10px;border-bottom:3px solid var(--tc)}
.team.r{border-radius:0 10px 10px 0;border-bottom:3px solid var(--tc);flex-direction:row-reverse}
.team .who{font-weight:700;font-size:13px;letter-spacing:.08em;line-height:1.05;color:var(--mute)}
.team .who b{display:block;color:var(--chalk);font-size:15px}
.team .n{font-style:italic;font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;margin-left:auto}
.team.r .n{margin-left:0;margin-right:auto}
#mid{display:flex;align-items:center;padding:0 9px;background:rgba(11,16,32,.82);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--mute);text-align:center;line-height:1.15}
#pill{top:calc(max(10px,env(safe-area-inset-top)) + 54px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;
  padding:4px 12px 4px 8px;border-radius:99px;background:rgba(11,16,32,.78);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;white-space:nowrap}
#pill i{width:14px;height:14px;border-radius:50%;background:var(--court);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
#pill.foot i{background:#fff;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 7px #222}
#radar{top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:92px;height:150px;border-radius:8px;
  background:rgba(11,16,32,.8);box-shadow:0 0 0 2px rgba(244,241,232,.25)}
#pause{top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));pointer-events:auto;width:44px;height:44px;border-radius:10px;background:rgba(11,16,32,.8);
  display:grid;place-items:center}
#pause::before{content:"";width:14px;height:16px;border-left:5px solid var(--chalk);border-right:5px solid var(--chalk)}
#toast{top:30%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-style:italic;font-weight:800;font-size:84px;
  letter-spacing:.02em;line-height:.95;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.5);opacity:0;white-space:nowrap}
#toast small{display:block;font-style:normal;font-weight:700;font-size:.3em;letter-spacing:.14em;color:var(--chalk)}
#toast.show{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}22%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}
#stick{border-radius:50%;border:2px solid rgba(244,241,232,.4);background:rgba(11,16,32,.35);opacity:.75;pointer-events:auto;touch-action:none}
#stick::before{content:"";position:absolute;inset:-28px;border-radius:50%}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:43%;height:43%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(244,241,232,.85);box-shadow:0 3px 10px rgba(0,0,0,.4);pointer-events:none}
.act{pointer-events:auto;touch-action:none;border-radius:50%;display:grid;place-items:center;align-content:center;font-family:var(--display);font-weight:700;letter-spacing:.08em;
  color:var(--night);box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35);transition:transform .06s,opacity .15s,filter .15s}
.act.down{transform:translateY(4px) scale(.96)}
.act.off{opacity:.42;filter:saturate(.4)}
#bShoot{background:var(--flare)}
#bShoulder{background:var(--court);letter-spacing:.02em}
#bShoot small{font-size:.66em;font-variant-numeric:tabular-nums;letter-spacing:.02em;opacity:.8}
#bTackle{background:var(--chalk)}
#hud.edit #score,#hud.edit #pill,#hud.edit #radar,#hud.edit #pause,#hud.edit #toast,#hud.edit #keys{display:none}
#hud.edit .ctl{opacity:1!important;filter:none!important;outline:2px dashed rgba(244,241,232,.55);outline-offset:6px;cursor:move}
#hud.edit .ctl.sel{outline:3px solid var(--flare)}
#settings{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:6px;border-radius:12px;background:rgba(11,16,32,.9)}
#settings .ghost{padding:8px 14px;font-size:18px;min-width:44px}
#settings .go{font-size:20px;padding:8px 18px;box-shadow:0 3px 0 #b38f1a}
#settings .lbl{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--mute);padding:0 6px;white-space:nowrap}
#keys{left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:var(--mute);background:rgba(11,16,32,.7);padding:4px 10px;border-radius:6px;white-space:nowrap}
@media (hover:none),(max-width:700px){#keys{display:none}}

/* ---------- Menus ---------- */
.screen{position:absolute;inset:0;display:flex;overflow-y:auto;
  background:linear-gradient(100deg,rgba(11,16,32,.96) 0%,rgba(11,16,32,.86) 46%,rgba(11,16,32,.25) 100%);
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
.panel{margin:auto 0;width:min(100%,520px);display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(54px,13vw,92px);line-height:.86;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--court)} h1 em{color:var(--pitch);font-style:inherit}
.lede{font-size:16px;line-height:1.45;color:#d5d9ea;max-width:46ch}
h2{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.grp{display:flex;flex-direction:column;gap:8px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;display:block;padding:12px 12px 12px;border-radius:12px;background:var(--ink);border:2px solid transparent;cursor:pointer}
.card input,.seg input{position:absolute;opacity:0;pointer-events:none}
.card strong{display:block;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.03em;line-height:1.05}
.card .tag{display:block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--tc);margin-bottom:2px}
.card p{font-size:13px;line-height:1.35;color:#c4c9de;margin-top:6px}
.card:has(input:checked){border-color:var(--tc);background:#1b2445}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink);border-radius:10px;padding:4px;gap:4px}
.seg label{position:relative;text-align:center;padding:9px 4px;border-radius:7px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.08em;cursor:pointer;color:var(--mute)}
.seg label:has(input:checked){background:var(--chalk);color:var(--night)}
.go{align-self:flex-start;padding:13px 34px 12px;border-radius:12px;background:var(--flare);color:var(--night);font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;letter-spacing:.04em;box-shadow:0 5px 0 #b38f1a}
.tapplay{position:absolute;left:max(28px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));font-size:26px;padding:10px 38px 9px;border-radius:12px;box-shadow:0 5px 0 #b38f1a,0 10px 24px rgba(0,0,0,.45);animation:breathe 1.8s ease-in-out infinite}
/* title: the staged 3D shot fills the screen; only a left-hand shade so the logo reads and the players stay clear */
#title{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,16,32,.85) 0%,rgba(11,16,32,.45) 34%,rgba(11,16,32,0) 58%),linear-gradient(0deg,rgba(11,16,32,.75) 0%,rgba(11,16,32,0) 30%)}
.tlogo{position:absolute;left:max(28px,env(safe-area-inset-left));top:max(22px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px}
.logo{display:flex;flex-direction:column;font-size:clamp(56px,13vh,104px);line-height:.82;letter-spacing:.005em;transform:skewX(-6deg);
  text-shadow:0 3px 0 rgba(0,0,0,.45),0 8px 26px rgba(0,0,0,.55)}
.logo span{color:var(--court)} .logo em{color:var(--chalk);-webkit-text-stroke:0}
.tline{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.24em;color:var(--chalk);padding-left:4px}
.tline i{display:block;width:22px;height:2px;background:var(--flare)}
.tver{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.16em;color:rgba(244,241,232,.55)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b38f1a}
.ghost{align-self:flex-start;padding:10px 18px;border-radius:10px;background:var(--ink);font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.big{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(56px,14vw,104px);line-height:.9}
.final{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--mute)}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--night);font-size:16px;line-height:1.5}
#app.short .panel{width:100%;max-width:880px;display:grid;grid-template-columns:1fr 1.25fr;column-gap:26px;row-gap:10px;align-items:start}
#app.short .panel>.head{grid-row:1 / span 3;display:flex;flex-direction:column;gap:12px}
#app.short h1{font-size:60px}#app.short .lede{font-size:14px}#app.short .card p{font-size:12px}
#app.short .big{font-size:64px}
#app.short #pill{top:calc(max(10px,env(safe-area-inset-top)) + 50px)}
#app.short #toast{font-size:64px;top:34%}
#app.tight #radar,#app.tight #pause{top:calc(max(10px,env(safe-area-inset-top)) + 60px)}
@media (prefers-reduced-motion:reduce){.tapplay{animation:none}#toast.show{animation-duration:1.3s;animation-timing-function:step-end}}
</style>
</head>
<body>
<div id="app">
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div id="score">
    <div class="team l" id="tMe"><span class="who">YOU<b id="meName">HOOPS</b></span><span class="n" id="meN">0</span></div>
    <div id="mid">TO 5</div>
    <div class="team r" id="tBot"><span class="who">BOT<b id="botName">BOOTS</b></span><span class="n" id="botN">0</span></div>
  </div>
  <div id="pill"><i></i><span id="pillT">BASKETBALL</span></div>
  <canvas id="radar" width="184" height="300" aria-label="Field radar"></canvas>
  <button id="pause" aria-label="Pause"></button>
  <div id="toast"></div>
  <div id="stick" class="ctl"><div id="knob"></div></div>
  <button class="act ctl" id="bTackle">STEAL</button>
  <button class="act ctl" id="bShoulder">SHOULDER</button>
  <button class="act ctl" id="bShoot"><span>SHOOT</span><small id="pct"></small></button>
  <div id="keys">WASD move · Space shoot · Shift steal · E shoulder</div>
</div>
<div id="settings" class="hidden">
  <span class="lbl">DRAG TO MOVE</span>
  <button class="ghost" id="szDown" aria-label="Smaller">−</button>
  <button class="ghost" id="szUp" aria-label="Bigger">+</button>
  <button class="ghost" id="lReset">RESET</button>
  <button class="go" id="lDone">DONE</button>
</div>

<div id="title">
  <div class="tlogo">
    <h1 class="logo"><span>DUAL</span><em>SPORTS</em></h1>
    <p class="tline">HOOP <i></i> VS <i></i> GOAL</p>
  </div>
  <button class="go tapplay" id="tap">PLAY</button>
  <span class="tver">1V1 · FIRST TO 5</span>
</div>

<div id="menu" class="screen hidden">
  <form class="panel" id="setup">
    <div class="head">
      <h1><span>DUAL</span> <em>SPORTS</em></h1>
      <button type="button" class="ghost" id="back">BACK</button>
    </div>
    <div class="grp">
      <h2>Play as</h2>
      <div class="cards">
        <label class="card" style="--tc:var(--hoops)"><input type="radio" name="who" id="whoB" value="B" checked>
          <span class="tag">HOOP</span><strong>Basketballer</strong></label>
        <label class="card" style="--tc:var(--boots)"><input type="radio" name="who" id="whoF" value="F">
          <span class="tag">GOAL</span><strong>Footballer</strong></label>
      </div>
    </div>
    <div class="grp">
      <h2>Bot difficulty</h2>
      <div class="seg">
        <label><input type="radio" name="diff" id="dE" value="easy">EASY</label>
        <label><input type="radio" name="diff" id="dM" value="medium" checked>MEDIUM</label>
        <label><input type="radio" name="diff" id="dH" value="hard">HARD</label>
      </div>
    </div>
    <div class="row"><button class="go" type="submit" id="play">PLAY</button><button class="ghost" type="button" id="openSet">SETTINGS</button></div>
  </form>
</div>

<div id="paused" class="screen hidden">
  <div class="panel">
    <div class="big">PAUSED</div>
    <div class="row"><button class="go" id="resume">RESUME</button><button class="ghost" id="restart">RESTART</button><button class="ghost" id="pSet">SETTINGS</button><button class="ghost" id="quit">MENU</button><button class="ghost" id="snd">SOUND ON</button></div>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="panel">
    <div class="big" id="overT">YOU WIN</div>
    <div class="final" id="overS"></div>
    <div class="row"><button class="go" id="again">REMATCH</button><button class="ghost" id="toMenu">MENU</button></div>
  </div>
</div>
<div id="err" class="hidden"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="sim">
/* ============================================================
   SIMULATION: rules, physics and bot AI. No rendering in here.
   ============================================================ */
const Sim=(function(){
'use strict';
const C={
  HL:22, HW:13,                 // half length (z) and half width (x) of the field, metres. Midline at z=0.
  G:22, PR:0.45, BR:0.26,
  HOOP:{x:0,y:3.05,z:-20.3}, RIM_IN:0.36, RIM_OUT:0.78,
  BOARD_Z:-20.95, BOARD_HW:0.95, BOARD_Y0:2.75, BOARD_Y1:3.95,
  GOAL_HW:3.6, GOAL_H:2.5, GOAL_D:0.9, DUNK_R:1.3,
  SPEED:7.2, CARRY:6.7, ACCEL:44,   // identical for both characters and every bot tier
  FUMBLE:0.30,                  // flat character rule: basketballer, hands on ball, football half. Never scaled by difficulty.
  WIN:5, STEAL_P:0.72, BARGE_P:0.5, BARGE_REACH:1.3, BARGE_CD:1.5, START_Z:7, KICK:25,
  REACH_B:1.15, REACH_F:1.0, HIGH_B:2.9, HIGH_F:1.35, TACKLE_REACH:1.3,
  P0:0.97, PK:0.02, CONTEST_B:0.17
};
// Difficulty = decision quality only. Speed, acceleration and think interval are the same on every tier.
const TIERS={
  easy:  {thr:0.05,patience:3, hold:[1.0,2.6],cutoff:0,   predict:0,   tackleR:2.8,bargeR:2.6,smart:false,aim:0,  evade:0.15},
  medium:{thr:0.36,patience:7, hold:[0.5,0.9],cutoff:0.55,predict:0.2, tackleR:1.9,bargeR:1.9,smart:true, aim:0.5,evade:0.7,press:1},
  hard:  {thr:0.56,patience:11,hold:[0.3,0.5],cutoff:1,   predict:0.4, tackleR:1.5,bargeR:1.5,smart:true, aim:1,  evade:1.1,press:1}
};
const THINK=0.12;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function gauss(m){let u=0;for(let i=0;i<4;i++)u+=m.rnd();return (u-2)*1.732;}
function ev(m,type,d){const e=d||{};e.type=type;m.events.push(e);}
const other=(m,p)=>m.players[p.id==='B'?'F':'B'];

function mkPlayer(id){return{id,x:0,z:0,vx:0,vz:0,face:0,jump:0,action:null,stun:0,pickupCd:0,tackleCd:0,bargeCd:0,immune:0,holdTime:0,dribble:0,
  ai:{tier:'medium',thinkT:0,poss:-1,minHold:0,side:1,evSide:1,evUntil:0,out:{mx:0,mz:0,shoot:false,tackle:false}}};}

function create(opt){
  opt=opt||{};
  const m={C,t:0,phase:'ready',phaseT:1.4,score:{B:0,F:0},players:{B:mkPlayer('B'),F:mkPlayer('F')},
    ball:{x:0,y:3,z:0,vx:0,vy:0,vz:0,owner:null,mode:'basket',shot:null},
    events:[],winner:null,human:opt.human||null,possId:0,lastScorer:null,conceded:null,
    rnd:opt.seed!=null?rng(opt.seed):Math.random};
  const t=opt.tiers||{};
  m.players.B.ai.tier=t.B||'medium'; m.players.F.ai.tier=t.F||'medium';
  reset(m,null);
  return m;
}
function reset(m,to){
  const B=m.players.B,F=m.players.F;
  for(const p of [B,F]){p.x=0;p.vx=p.vz=0;p.jump=0;p.action=null;p.stun=0;p.pickupCd=0;p.tackleCd=0.6;p.bargeCd=0.6;p.immune=0;p.holdTime=0;p.ai.thinkT=0;p.ai.out.mx=p.ai.out.mz=0;}
  B.z=C.START_Z;B.face=Math.PI; F.z=-C.START_Z;F.face=0;   // each starts on the side they defend
  const b=m.ball;b.vx=b.vy=b.vz=0;b.shot=null;
  if(to){b.owner=to;m.possId++;m.players[to].immune=0.8;setMode(m,to==='B'?'basket':'foot');const h=heldPos(m,m.players[to]);b.x=h.x;b.y=h.y;b.z=h.z;}
  else{b.owner=null;b.x=0;b.y=3;b.z=0;setMode(m,'basket');}
  m.phase='ready';m.phaseT=1.4;
}
function setMode(m,mode){if(m.ball.mode!==mode){m.ball.mode=mode;ev(m,'morph',{mode});}}

function heldPos(m,p){
  const fx=Math.sin(p.face),fz=Math.cos(p.face);
  if(p.id==='F')return{x:p.x+fx*0.8,y:C.BR,z:p.z+fz*0.8};
  const a=p.action;
  if(a&&a.type==='shoot'){const k=clamp(a.t/a.rel,0,1);return{x:p.x+fx*lerp(0.5,0.25,k)-fz*lerp(0.42,0.1,k),y:lerp(1.1,2.35,k)+p.jump,z:p.z+fz*lerp(0.5,0.25,k)+fx*lerp(0.42,0.1,k)};}
  return{x:p.x+fx*0.5-fz*0.42,y:C.BR+0.95*Math.abs(Math.sin(p.dribble)),z:p.z+fz*0.5+fx*0.42};
}

/* ---- shot quality estimates: used by bots to decide and shown to the human on the Shoot button ---- */
function pBasket(m,x,z){
  const F=m.players.F,d=Math.hypot(x-C.HOOP.x,z-C.HOOP.z);
  if(z<C.HOOP.z-0.3)return 0.02;                       // behind the backboard
  const c=clamp((2.8-Math.hypot(F.x-x,F.z-z))/2.0,0,1);
  return clamp(C.P0-C.PK*Math.max(0,d-1.5)-C.CONTEST_B*c,0.03,0.9);
}
function kickSigma(L,contest){return 0.04+0.0045*L+0.08*contest;}
function pGoal(m,aimQ){
  const F=m.players.F,K=m.players.B,sx=F.x,sz=F.z;
  const contest=clamp((2.2-Math.hypot(K.x-sx,K.z-sz))/1.6,0,1);
  const cand=[-3,-1.5,0,1.5,3];let best={p:-1,aimX:0};const all=[];
  for(const ax of cand){
    const dx=ax-sx,dz=C.HL-sz,L=Math.hypot(dx,dz)||1,ux=dx/L,uz=dz/L;
    const s=(K.x-sx)*ux+(K.z-sz)*uz;
    let open=2.5;
    if(s>0){const t=Math.min(s,L),perp=Math.hypot(K.x-(sx+ux*t),K.z-(sz+uz*t));
      open=perp-(C.REACH_B+C.SPEED*0.75*Math.max(0,t/C.KICK-0.12));}
    const spread=L*kickSigma(L,contest),margin=(C.GOAL_HW-Math.abs(ax))*Math.abs(dz)/L;
    const pOn=clamp(0.5+0.42*margin/spread,0,1);
    const pOpen=clamp(0.5+open*0.5,0.1,1);
    const p=pOn*pOpen*clamp(1.2-L/26,0.15,1);
    all.push({p,aimX:ax});if(p>best.p)best={p,aimX:ax};
  }
  if(aimQ<1&&m.rnd()>aimQ){const r=all[1+Math.floor(m.rnd()*3)];return{p:best.p,aimX:r.aimX};}  // weaker aim: central, toward the keeper
  return best;
}

/* ---- actions ---- */
function startShoot(m,p,inp){
  const isB=p.id==='B';
  p.action={type:'shoot',t:0,rel:isB?0.36:0.2,dur:isB?0.8:0.5,released:false,aimX:(inp&&inp.aimX!=null)?inp.aimX:null,dunk:!!(inp&&inp.dunk)};
  ev(m,'windup',{by:p.id});
}
function release(m,p){
  const b=m.ball,a=p.action;
  if(p.id==='B'){
    const h=heldPos(m,p),d=Math.hypot(p.x-C.HOOP.x,p.z-C.HOOP.z),pm=pBasket(m,p.x,p.z);
    const make=a.dunk||(m.rnd()<pm&&pm>0.02);
    let tx=C.HOOP.x,tz=C.HOOP.z;
    if(!make){const ang=m.rnd()*6.283,r=m.rnd()<0.25?0.9+m.rnd()*0.5:0.5+m.rnd()*0.2;tx+=Math.cos(ang)*r;tz+=Math.sin(ang)*r;}
    const T=a.dunk?0.32:clamp(0.82+d*0.05,0.85,1.9);
    b.x=h.x;b.y=h.y;b.z=h.z;b.vx=(tx-b.x)/T;b.vz=(tz-b.z)/T;b.vy=(C.HOOP.y-b.y+0.5*C.G*T*T)/T;
    b.shot={by:'B',make,p:pm,dunk:a.dunk};p.pickupCd=0.7;
  }else{
    const h=heldPos(m,p),K=m.players.B;
    const ax=a.aimX!=null?a.aimX:pGoal(m,1).aimX;
    let dx=ax-h.x,dz=C.HL+0.4-h.z;const L=Math.hypot(dx,dz)||1;
    const contest=clamp((2.2-Math.hypot(K.x-p.x,K.z-p.z))/1.6,0,1);
    const ang=Math.atan2(dx,dz)+gauss(m)*kickSigma(L,contest);
    b.x=h.x;b.y=C.BR;b.z=h.z;b.vx=Math.sin(ang)*C.KICK;b.vz=Math.cos(ang)*C.KICK;b.vy=2.5+L*0.16;
    b.shot={by:'F'};p.pickupCd=0.5;
  }
  b.owner=null;m.possId++;p.holdTime=0;
  ev(m,'shoot',{by:p.id});
}
function startTackle(m,p,inp){
  const b=m.ball,opp=other(m,p);let dx,dz;
  if(inp&&inp.tdx!=null){dx=inp.tdx;dz=inp.tdz;}
  else{ // human: lunge at the ball if it is close, otherwise straight ahead
    const held=b.owner===opp.id,tp=held?heldPos(m,opp):b,lead=held?0.16:0.1;
    dx=tp.x+(held?opp.vx:b.vx)*lead-p.x;dz=tp.z+(held?opp.vz:b.vz)*lead-p.z;
    if(Math.hypot(dx,dz)>6){dx=Math.sin(p.face);dz=Math.cos(p.face);}
  }
  const n=Math.hypot(dx,dz)||1;dx/=n;dz/=n;
  const isB=p.id==='B';
  p.action={type:'tackle',t:0,dur:isB?0.3:0.38,rec:isB?0.38:0.5,dx,dz,v0:isB?11.5:12.5,done:false};
  p.face=Math.atan2(dx,dz);p.tackleCd=1.1;
  ev(m,'lunge',{by:p.id});
}
// Shoulder challenge: a body move both characters have. It knocks the ball loose (no hands, so no fumble roll),
// unlike a steal or tackle, which hands possession over on the spot.
function startBarge(m,p,inp){
  const opp=other(m,p);let dx,dz;
  if(inp&&inp.bdx!=null){dx=inp.bdx;dz=inp.bdz;}
  else{dx=opp.x-p.x;dz=opp.z-p.z;if(Math.hypot(dx,dz)>3.5){dx=Math.sin(p.face);dz=Math.cos(p.face);}}
  const n=Math.hypot(dx,dz)||1;dx/=n;dz/=n;
  p.action={type:'barge',t:0,dur:0.24,rec:0.3,dx,dz,v0:10,done:false};p.face=Math.atan2(dx,dz);p.bargeCd=C.BARGE_CD;
  ev(m,'barge',{by:p.id});
}
function tryBarge(m,p,a){
  if(a.done)return;const opp=other(m,p),b=m.ball;
  const ox=opp.x-p.x,oz=opp.z-p.z,d=Math.hypot(ox,oz);
  if(d>C.BARGE_REACH)return;
  a.done=true;
  const nx=d>0.01?ox/d:a.dx,nz=d>0.01?oz/d:a.dz;
  if(b.owner===opp.id){
    if(opp.immune>0)return;
    const closing=Math.max(0,(p.vx-opp.vx)*nx+(p.vz-opp.vz)*nz);
    if(m.rnd()<clamp(C.BARGE_P+0.03*closing,0,0.85)){
      b.owner=null;m.possId++;b.shot=null;
      const sp=2.5+m.rnd()*2;b.vx=opp.vx*0.4+nx*sp+(m.rnd()-0.5)*2;b.vz=opp.vz*0.4+nz*sp+(m.rnd()-0.5)*2;
      b.vy=b.mode==='basket'?3.5:1.6;b.y=Math.max(b.y,0.5);
      opp.action={type:'stumble',t:0,dur:0.5};opp.stun=0.5;opp.jump=0;opp.pickupCd=0.7;opp.vx=nx*4.5;opp.vz=nz*4.5;
      p.pickupCd=0;
      ev(m,'knock',{by:p.id});
    }else{
      p.action={type:'stumble',t:0,dur:0.4};p.stun=0.4;p.vx=-nx*3;p.vz=-nz*3;opp.vx*=0.5;opp.vz*=0.5;
      ev(m,'bargeMiss',{by:p.id});
    }
  }else{   // no ball on them: a plain shove, useful when racing for a loose ball
    opp.vx+=nx*5;opp.vz+=nz*5;opp.stun=Math.max(opp.stun,0.3);
    ev(m,'shove',{by:p.id});
  }
}
function takeBall(m,p,how){
  const b=m.ball;b.owner=p.id;b.shot=null;m.possId++;p.holdTime=0;p.dribble=1.2;
  setMode(m,p.id==='B'?'basket':'foot');
  ev(m,how,{by:p.id});
}
function tryTackle(m,p,a){
  const b=m.ball,opp=other(m,p);
  if(a.done||b.owner!==opp.id||opp.immune>0)return;
  const bp=heldPos(m,opp);
  if(Math.hypot(bp.x-p.x,bp.z-p.z)>C.TACKLE_REACH)return;
  a.done=true;
  if(p.id==='B'&&p.z>0&&m.rnd()<C.FUMBLE){   // hands on the ball in the football half: the grab slips, footballer keeps it
    p.action={type:'fumble',t:0,dur:0.6};p.stun=0.6;ev(m,'fumble',{by:'B',kind:'steal'});return;
  }
  if(m.rnd()<C.STEAL_P){   // success: possession flips this instant, no loose-ball window
    opp.action={type:'stumble',t:0,dur:0.5};opp.stun=0.5;opp.jump=0;opp.tackleCd=Math.max(opp.tackleCd,0.9);
    p.action=null;p.immune=0.9;
    takeBall(m,p,'steal');
  }else ev(m,'tackleMiss',{by:p.id});
}

function updatePlayer(m,p,inp,dt){
  const b=m.ball,has=b.owner===p.id,play=m.phase==='play';
  p.pickupCd=Math.max(0,p.pickupCd-dt);p.tackleCd=Math.max(0,p.tackleCd-dt);p.bargeCd=Math.max(0,p.bargeCd-dt);p.immune=Math.max(0,p.immune-dt);p.stun=Math.max(0,p.stun-dt);
  if(has){p.holdTime+=dt;p.dribble+=dt*(7+Math.hypot(p.vx,p.vz)*0.45);}
  let maxSp=has?C.CARRY:C.SPEED,control=play&&p.stun<=0,turn=true;
  const a=p.action;
  if(a){
    a.t+=dt;
    if(a.type==='shoot'){
      maxSp*=0.25;turn=false;
      const tgt=p.id==='B'?C.HOOP:{x:a.aimX!=null?a.aimX:0,z:C.HL};
      p.face=turnTo(p.face,Math.atan2(tgt.x-p.x,tgt.z-p.z),18*dt);
      if(p.id==='B')p.jump=Math.max(0,(a.dunk?1.3:0.85)*Math.sin(Math.PI*clamp((a.t-0.1)/0.62,0,1)));
      if(!a.released&&a.t>=a.rel){a.released=true;if(b.owner===p.id)release(m,p);}
      if(a.t>=a.dur){p.action=null;p.jump=0;}
    }else if(a.type==='tackle'||a.type==='barge'){
      control=false;turn=false;
      if(a.t<a.dur){const sp=lerp(a.v0,3.5,a.t/a.dur);p.vx=a.dx*sp;p.vz=a.dz*sp;(a.type==='tackle'?tryTackle:tryBarge)(m,p,a);}
      else if(a.t<a.dur+a.rec){const k=Math.exp(-9*dt);p.vx*=k;p.vz*=k;}
      else p.action=null;
    }else{control=false;if(a.t>=a.dur)p.action=null;}
  }
  if(control){
    let mx=inp.mx||0,mz=inp.mz||0;const n=Math.hypot(mx,mz);if(n>1){mx/=n;mz/=n;}
    const dvx=mx*maxSp-p.vx,dvz=mz*maxSp-p.vz,dv=Math.hypot(dvx,dvz),lim=C.ACCEL*dt;
    if(dv>lim){p.vx+=dvx/dv*lim;p.vz+=dvz/dv*lim;}else{p.vx+=dvx;p.vz+=dvz;}
    if(!p.action){
      if(inp.shoot&&has)startShoot(m,p,inp);
      else if(inp.tackle&&!has&&p.tackleCd<=0)startTackle(m,p,inp);
      else if(inp.barge&&!has&&p.bargeCd<=0)startBarge(m,p,inp);
    }
  }else if(!(p.action&&(p.action.type==='tackle'||p.action.type==='barge'))){const k=Math.exp(-10*dt);p.vx*=k;p.vz*=k;}
  // carrying it in: a basketballer who reaches the hoop dunks without needing the Shoot button
  if(play&&has&&p.id==='B'&&!p.action&&p.stun<=0&&p.z>C.HOOP.z-0.2&&Math.hypot(p.x-C.HOOP.x,p.z-C.HOOP.z)<C.DUNK_R)startShoot(m,p,{dunk:true});
  // the goal mouth is open to players as well as the ball
  const wasIn=p.z>C.HL-C.PR+0.001,mouth=C.GOAL_HW-C.PR;
  let nx=clamp(p.x+p.vx*dt,-C.HW+C.PR,C.HW-C.PR),nz=p.z+p.vz*dt;
  if(wasIn&&Math.abs(nx)>mouth){nx=clamp(nx,-mouth,mouth);nz=Math.min(nz,p.z-5*dt);}   // slide back out round the post
  else if(nz>C.HL-C.PR&&Math.abs(nx)>mouth)nz=C.HL-C.PR;
  p.x=nx;p.z=clamp(nz,-C.HL+C.PR,C.HL+C.GOAL_D);
  if(turn&&Math.hypot(p.vx,p.vz)>0.6)p.face=turnTo(p.face,Math.atan2(p.vx,p.vz),14*dt);
}
function turnTo(a,b,max){let d=b-a;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;return a+clamp(d,-max,max);}

function score(m,by,how){
  m.score[by]++;m.lastScorer=by;m.conceded=by==='B'?'F':'B';m.phase='scored';m.phaseT=2.3;m.ball.shot=null;
  ev(m,'score',{by,how:how||'shot'});
}
function updateBall(m,dt){
  const b=m.ball,P=m.players;
  if(b.owner){const o=P[b.owner],h=heldPos(m,o);b.x=h.x;b.y=h.y;b.z=h.z;b.vx=o.vx;b.vz=o.vz;b.vy=0;
    if(b.z>C.HL-C.BR){
      if(Math.abs(b.x)>=C.GOAL_HW-C.BR*0.5)b.z=C.HL-C.BR;
      else if(b.owner==='F'&&b.z>C.HL+0.15&&m.phase==='play'){   // footballer dribbles the ball over the line: goal
        b.owner=null;m.possId++;b.vx=o.vx*0.5;b.vz=Math.max(3,o.vz);score(m,'F','walk');}
    }
    return;}
  if(m.phase==='ready')return;
  const py=b.y,px=b.x,pz=b.z,basket=b.mode==='basket';
  b.vy-=C.G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
  // hoop plane: falling through the ring scores, clipping the rim bounces out
  if(py>C.HOOP.y&&b.y<=C.HOOP.y){
    const k=(py-C.HOOP.y)/(py-b.y),hx=lerp(px,b.x,k)-C.HOOP.x,hz=lerp(pz,b.z,k)-C.HOOP.z,r=Math.hypot(hx,hz);
    if(r<C.RIM_IN){if(m.phase==='play'){b.vx*=0.25;b.vz*=0.25;b.vy*=0.55;score(m,'B',b.shot&&b.shot.dunk?'dunk':'shot');}}
    else if(r<C.RIM_OUT){const sp=1.5+m.rnd()*3;b.y=C.HOOP.y+0.02;b.vy=Math.abs(b.vy)*0.4+1;b.vx=hx/r*sp;b.vz=hz/r*sp;b.shot=null;ev(m,'rim');}
  }
  // backboard
  if(Math.abs(b.x-C.HOOP.x)<C.BOARD_HW&&b.y>C.BOARD_Y0&&b.y<C.BOARD_Y1){
    if(pz-C.BR>=C.BOARD_Z&&b.z-C.BR<C.BOARD_Z){b.z=C.BOARD_Z+C.BR;b.vz=Math.abs(b.vz)*0.5;ev(m,'board');}
    else if(pz+C.BR<=C.BOARD_Z&&b.z+C.BR>C.BOARD_Z){b.z=C.BOARD_Z-C.BR;b.vz=-Math.abs(b.vz)*0.5;ev(m,'board');}
  }
  // ground: bouncy in the basketball half, heavy and rolling in the football half
  if(b.y<C.BR){
    b.y=C.BR;
    if(b.vy<0){const v=-b.vy;
      if(v*(basket?0.74:0.38)<1.3)b.vy=0;   // resting contact: no bounce, and no friction hit (gravity re-touches the floor every frame)
      else{b.vy=v*(basket?0.74:0.38);const f=basket?0.93:0.85;b.vx*=f;b.vz*=f;ev(m,'bounce',{v,mode:b.mode,z:b.z});}
      if(b.shot&&b.shot.by==='B')b.shot=null;}
    if(b.vy===0){   // rolling: drag proportional to speed (long smooth taper) plus a whisper of constant friction so it settles
      const sp=Math.hypot(b.vx,b.vz),k=Math.exp(-(basket?0.45:0.95)*dt),ns=sp*k-(basket?0.1:0.16)*dt;
      if(ns<=0.04){b.vx=b.vz=0;}else{const f=ns/sp;b.vx*=f;b.vz*=f;}}
  }
  // side and end boards; the goal mouth is the only opening
  if(b.x>C.HW-C.BR){if(b.vx>2.5&&b.y<1)ev(m,'wall',{v:b.vx});b.x=C.HW-C.BR;b.vx=-Math.abs(b.vx)*0.6;}
  if(b.x<-C.HW+C.BR){if(b.vx<-2.5&&b.y<1)ev(m,'wall',{v:-b.vx});b.x=-C.HW+C.BR;b.vx=Math.abs(b.vx)*0.6;}
  if(b.z<-C.HL+C.BR){if(b.vz<-2.5&&b.y<1)ev(m,'wall',{v:-b.vz});b.z=-C.HL+C.BR;b.vz=Math.abs(b.vz)*0.6;}
  if(b.z>C.HL-C.BR){
    const inMouth=Math.abs(b.x)<C.GOAL_HW-C.BR*0.5&&b.y<C.GOAL_H;
    if(inMouth||pz>C.HL){
      if(b.z>C.HL+0.15&&m.phase==='play')score(m,'F');
      if(b.z>C.HL){b.x=clamp(b.x,-C.GOAL_HW+C.BR,C.GOAL_HW-C.BR);b.y=Math.min(b.y,C.GOAL_H-C.BR);const k=Math.exp(-7*dt);b.vx*=k;b.vz*=k;if(b.z>C.HL+1.2){b.z=C.HL+1.2;b.vz=0;}}
    }else{if(b.vz>2.5&&b.y<1)ev(m,'wall',{v:b.vz});b.z=C.HL-C.BR;b.vz=-Math.abs(b.vz)*0.6;}
  }
  // a loose ball takes its sport from the half it is in
  if(b.mode==='basket'&&b.z>0.4)setMode(m,'foot');else if(b.mode==='foot'&&b.z<-0.4)setMode(m,'basket');
  if(m.phase!=='play')return;
  // pickups and body deflections, nearest player first
  const dB=Math.hypot(P.B.x-b.x,P.B.z-b.z),dF=Math.hypot(P.F.x-b.x,P.F.z-b.z);
  const order=dB<dF?[[P.B,dB],[P.F,dF]]:[[P.F,dF],[P.B,dB]];
  for(const [p,d] of order){
    const isB=p.id==='B',busy=p.action&&p.action.type==='shoot';
    if(d<(isB?C.REACH_B:C.REACH_F)&&b.y<(isB?C.HIGH_B+p.jump:C.HIGH_F)&&p.pickupCd<=0&&p.stun<=0&&!busy){
      if(isB&&p.z>0&&m.rnd()<C.FUMBLE){fumble(m,p);}
      else{if(p.action&&p.action.type==='tackle')p.action=null;p.immune=0.45;takeBall(m,p,'pickup');}
      return;
    }
    if(d<C.PR+C.BR&&b.y<1.9+p.jump&&d>0.001){   // ball hits a body
      const nx=(b.x-p.x)/d,nz=(b.z-p.z)/d,vn=(b.vx-p.vx)*nx+(b.vz-p.vz)*nz;
      b.x=p.x+nx*(C.PR+C.BR);b.z=p.z+nz*(C.PR+C.BR);
      if(vn<0){b.vx-=1.35*vn*nx;b.vz-=1.35*vn*nz;}
    }
  }
}
function fumble(m,p){
  const b=m.ball,sp=Math.hypot(b.vx,b.vz);
  const ang=sp>1?Math.atan2(b.vx,b.vz)+(m.rnd()<0.5?-1:1)*(0.7+m.rnd()*1.6):m.rnd()*6.283,ns=Math.max(4.5,sp*0.45);
  b.vx=Math.sin(ang)*ns;b.vz=Math.cos(ang)*ns;b.vy=3+m.rnd()*2;b.y=Math.max(b.y,0.6);
  p.stun=0.55;p.pickupCd=0.95;p.action={type:'fumble',t:0,dur:0.55};
  ev(m,'fumble',{by:'B',kind:'grab'});
}

/* ---- bot ---- */
function ballAt(m,t){const b=m.ball;return{x:clamp(b.x+b.vx*t,-C.HW+0.5,C.HW-0.5),z:clamp(b.z+b.vz*t,-C.HL+0.5,C.HL-0.5)};}
function bot(m,me,dt){
  const ai=me.ai,T=TIERS[ai.tier],opp=other(m,me),b=m.ball,out=ai.out;
  out.shoot=false;out.tackle=false;out.barge=false;out.tdx=null;out.bdx=null;out.aimX=null;
  ai.thinkT-=dt;if(ai.thinkT>0)return out;ai.thinkT=THINK;
  const guard=me.id==='B'?{x:0,z:C.HL}:{x:C.HOOP.x,z:C.HOOP.z};   // the target I defend
  let tx=me.x,tz=me.z,stopR=0.25;
  if(b.owner===me.id){
    if(ai.poss!==m.possId){ai.poss=m.possId;ai.minHold=T.hold[0]+m.rnd()*(T.hold[1]-T.hold[0]);ai.side=m.rnd()<0.5?-1:1;ai.evUntil=0;}
    // Shot selection: Easy fires at almost any look, Hard waits for a high-percentage one.
    let q,aim=null;
    if(me.id==='B')q=pBasket(m,me.x,me.z);else{const g=pGoal(m,T.aim);q=g.p;aim=g.aimX;}
    const near=Math.hypot(opp.x-me.x,opp.z-me.z)<2.7&&opp.stun<=0&&opp.tackleCd<0.25;   // about to be tackled: a smart bot takes the look it has
    const thr=T.thr*Math.max(0.3,1-me.holdTime/T.patience)*(T.smart&&near?T.press:1);
    if(me.holdTime>=ai.minHold&&q>=thr&&!me.action){out.shoot=true;out.aimX=aim;}
    const spot=me.id==='B'?{x:C.HOOP.x+ai.side*1.4,z:C.HOOP.z+2.8}:{x:ai.side*1.6,z:C.HL-6};
    let dx=spot.x-me.x,dz=spot.z-me.z;const d=Math.hypot(dx,dz)||1;dx/=d;dz/=d;
    const ox=opp.x-me.x,oz=opp.z-me.z,dO=Math.hypot(ox,oz);
    if(dO<5.5&&dx*ox+dz*oz>0&&opp.stun<=0){   // drive around the defender; Easy barely bothers
      const px=-dz,pz=dx,lat=px*ox+pz*oz;
      let s=lat>0?-1:1;if(Math.abs(lat)<0.6)s=ai.side;
      if(m.t<ai.evUntil)s=ai.evSide;else{ai.evSide=s;ai.evUntil=m.t+0.6;}
      const w=clamp((5.5-dO)/3,0,1)*1.6*T.evade;dx+=px*s*w;dz+=pz*s*w;
    }
    if(me.x>C.HW-1.5&&dx>0)dx*=0.1;if(me.x<-C.HW+1.5&&dx<0)dx*=0.1;
    const n=Math.hypot(dx,dz)||1,k=d<0.8?0:1;
    out.mx=dx/n*k;out.mz=dz/n*k;return out;
  }
  if(b.owner===opp.id){
    // Defensive positioning: Easy chases the carrier head-on. Hard reads where the carrier is going
    // and stands on the line between them and the target, then closes.
    const cx=opp.x+opp.vx*T.predict,cz=opp.z+opp.vz*T.predict;
    let ux=guard.x-cx,uz=guard.z-cz;const D=Math.hypot(ux,uz)||1;ux/=D;uz/=D;
    const s=(me.x-cx)*ux+(me.z-cz)*uz,lat=Math.abs(-(me.x-cx)*uz+(me.z-cz)*ux);
    const cushion=Math.min((s>0.4&&lat<2.2)?1.6:Math.min(D*0.6,5),Math.max(0.2,D-0.4));
    tx=lerp(opp.x,cx+ux*cushion,T.cutoff);tz=lerp(opp.z,cz+uz*cushion,T.cutoff);
    if(!me.action&&me.stun<=0&&opp.immune<=0){
      const bp=heldPos(m,opp),dBall=Math.hypot(bp.x-me.x,bp.z-me.z),dP=Math.hypot(opp.x-me.x,opp.z-me.z);
      if(T.smart){
        // Smart bots read the shield: ball on the far side of the carrier means shoulder in, ball in reach means steal.
        if(dBall>dP+0.25&&dP<T.bargeR&&me.bargeCd<=0){out.barge=true;out.bdx=opp.x-me.x;out.bdz=opp.z-me.z;}
        else if(dBall<T.tackleR&&me.tackleCd<=0){out.tackle=true;const lead=T.predict*0.4;out.tdx=bp.x+opp.vx*lead-me.x;out.tdz=bp.z+opp.vz*lead-me.z;}
      }else if(dP<T.tackleR){   // Easy picks a challenge at random, often from too far away
        if(me.tackleCd<=0&&m.rnd()<0.5){out.tackle=true;out.tdx=opp.x-me.x;out.tdz=opp.z-me.z;}
        else if(me.bargeCd<=0&&dP<T.bargeR&&m.rnd()<0.35){out.barge=true;out.bdx=opp.x-me.x;out.bdz=opp.z-me.z;}
      }
    }
  }else{
    let tgt={x:b.x,z:b.z};
    if(T.predict>0){
      let pr=tgt;const sp=Math.hypot(b.vx,b.vz);
      if(b.shot&&b.shot.by==='B'&&b.y>2.2)pr={x:C.HOOP.x,z:C.HOOP.z+1.6};             // go where the rebound will be
      else if(b.shot&&b.shot.by==='F'&&me.id==='B'&&sp>8){                              // step into the shot's path
        const ux=b.vx/sp,uz=b.vz/sp;let s=clamp((me.x-b.x)*ux+(me.z-b.z)*uz,0,40);
        if(uz>0)s=Math.min(s,(C.HL-0.7-b.z)/uz);pr={x:b.x+ux*Math.max(0,s),z:b.z+uz*Math.max(0,s)};
      }else{for(let t=0.1;t<=1.5;t+=0.1){pr=ballAt(m,t);if(Math.hypot(pr.x-me.x,pr.z-me.z)<=C.SPEED*t+0.9)break;}}
      tgt={x:lerp(b.x,pr.x,T.cutoff),z:lerp(b.z,pr.z,T.cutoff)};
    }
    if(T.cutoff>0&&Math.hypot(opp.x-b.x,opp.z-b.z)+3<Math.hypot(tgt.x-me.x,tgt.z-me.z)){   // opponent wins the race: drop goal-side instead
      tgt={x:lerp(tgt.x,lerp(b.x,guard.x,0.4),T.cutoff),z:lerp(tgt.z,lerp(b.z,guard.z,0.4),T.cutoff)};
    }
    // racing for a loose ball the opponent will reach first: a smart bot shoulders them off it
    const dOpp=Math.hypot(opp.x-me.x,opp.z-me.z),oB=Math.hypot(opp.x-b.x,opp.z-b.z);
    if(T.smart&&me.bargeCd<=0&&!me.action&&me.stun<=0&&dOpp<1.3&&oB<3&&oB<Math.hypot(me.x-b.x,me.z-b.z)){out.barge=true;out.bdx=opp.x-me.x;out.bdz=opp.z-me.z;}
    tx=tgt.x;tz=tgt.z;stopR=0.15;
  }
  const dx=tx-me.x,dz=tz-me.z,d=Math.hypot(dx,dz);
  if(d<stopR){out.mx=out.mz=0;}else{out.mx=dx/d;out.mz=dz/d;}
  return out;
}

const ZERO={mx:0,mz:0,shoot:false,tackle:false,barge:false};
function step(m,dt,human){
  m.t+=dt;const P=m.players;
  if(m.phase==='ready'){m.phaseT-=dt;if(m.phaseT<=0){m.phase='play';ev(m,'kickoff');}}
  else if(m.phase==='scored'){m.phaseT-=dt;if(m.phaseT<=0){
    if(m.score.B>=C.WIN||m.score.F>=C.WIN){m.phase='over';m.winner=m.score.B>=C.WIN?'B':'F';ev(m,'over',{winner:m.winner});}
    else reset(m,m.conceded);}}
  const play=m.phase==='play';
  for(const id of ['B','F']){
    const p=P[id];let inp=ZERO;
    if(play)inp=(id===m.human)?(human||ZERO):bot(m,p,dt);
    updatePlayer(m,p,inp,dt);
  }
  const dx=P.F.x-P.B.x,dz=P.F.z-P.B.z,d=Math.hypot(dx,dz);
  if(d<2*C.PR&&d>0.001){const push=(2*C.PR-d)/2,nx=dx/d,nz=dz/d;P.B.x-=nx*push;P.B.z-=nz*push;P.F.x+=nx*push;P.F.z+=nz*push;}
  updateBall(m,dt);
}
return{C,TIERS,create,step,reset,heldPos,pBasket,pGoal};
})();

function readInput(dt){
  let jx=input.jx,jy=input.jy;const k=input.keys;
  if(k.u||k.d||k.l||k.r){jx=(k.r?1:0)-(k.l?1:0);jy=(k.u?1:0)-(k.d?1:0);const n=Math.hypot(jx,jy)||1;jx/=n;jy/=n;}
  // the stick's frame of reference trails the camera, so a held direction does not swerve when the camera swings round
  let d=camYaw-refYaw;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;
  refYaw+=d*Math.min(1,dt*((jx||jy)?1.3:12));
  const cy=Math.cos(refYaw),sy=Math.sin(refYaw);
  simIn.mx=-cy*jx+sy*jy;simIn.mz=sy*jx+cy*jy;
}

const rc=$('radar'),rg=rc.getContext('2d');
function drawRadar(m){
  const w=rc.width,h=rc.height,flip=human==='F',pad=10,iw=w-pad*2,ih=h-pad*2;
  const X=x=>pad+(flip?(C.HW-x):(x+C.HW))/(2*C.HW)*iw,Z=z=>pad+(flip?(C.HL-z):(z+C.HL))/(2*C.HL)*ih;
  rg.clearRect(0,0,w,h);
  const zc=Z(-C.HL),z0=Z(0),zg=Z(C.HL);
  rg.fillStyle='rgba(240,138,53,.5)';rg.fillRect(pad,Math.min(zc,z0),iw,Math.abs(z0-zc));
  rg.fillStyle='rgba(53,194,116,.5)';rg.fillRect(pad,Math.min(zg,z0),iw,Math.abs(zg-z0));
  rg.strokeStyle='rgba(244,241,232,.9)';rg.lineWidth=2;rg.strokeRect(pad,pad,iw,ih);rg.beginPath();rg.moveTo(pad,z0);rg.lineTo(pad+iw,z0);rg.stroke();
  rg.lineWidth=4;rg.strokeStyle='#ff7a1a';rg.beginPath();rg.arc(X(C.HOOP.x),Z(C.HOOP.z),7,0,6.2832);rg.stroke();
  rg.strokeStyle='#fff';rg.lineWidth=5;rg.beginPath();rg.moveTo(X(-C.GOAL_HW),zg);rg.lineTo(X(C.GOAL_HW),zg);rg.stroke();
  for(const id of ['B','F']){const p=m.players[id],x=X(p.x),z=Z(p.z);
    if(id===human){const a=Math.atan2((flip?-1:1)*Math.sin(camYaw),(flip?-1:1)*Math.cos(camYaw));   // view cone
      rg.fillStyle='rgba(255,255,255,.22)';rg.beginPath();rg.moveTo(x,z);rg.arc(x,z,40,Math.PI/2-a-0.5,Math.PI/2-a+0.5);rg.closePath();rg.fill();}
    rg.fillStyle=KIT[id].css;rg.beginPath();rg.arc(x,z,9,0,6.2832);rg.fill();
    if(id===human){rg.strokeStyle='#fff';rg.lineWidth=3;rg.stroke();}}

}

function handleEvents(m){
  for(const e of m.events){
    const mine=e.by===human,inGame=!!human;
    switch(e.type){
      case 'morph':startMorph(e.mode);Snd.morph(e.mode);break;
      case 'bounce':Snd.bounce(e.v,e.mode,e.z<0?'wood':'grass');break;
      case 'rim':Snd.rim();if(inGame)Snd.ooh();break;
      case 'board':Snd.board();break;
      case 'wall':Snd.wall(e.v);break;
      case 'shoot':if(e.by==='F')Snd.kick(1);else Snd.release();break;
      case 'lunge':if(e.by==='F')Snd.slide();else Snd.squeak();if(e.by==='F'){const p=m.players.F;burst({x:p.x,y:0.1,z:p.z},0x7fd69b,6,2.5,0.4,4);}break;
      case 'steal':Snd.body(0.6);Snd.touch();
        if(inGame)toast(mine?(human==='B'?'STEAL!':'TACKLE!'):'STOLEN!',null,KIT[e.by].css);break;
      case 'fumble':Snd.bounce(5,'basket',m.ball.z<0?'wood':'grass',0.12);if(inGame)toast('FUMBLE!',null,KIT.B.css);break;
      case 'pickup':Snd.touch();break;
      case 'barge':if(m.players[e.by].z<0)Snd.squeak();break;
      case 'knock':Snd.body(1);if(inGame)toast(mine?'SHOULDER!':'BUMPED!',null,KIT[e.by].css);break;
      case 'bargeMiss':case 'shove':Snd.body(0.7);break;
      case 'kickoff':if(inGame)Snd.whistle(false);break;
      case 'score':{const isB=e.by==='B';if(isB)Snd.swish();else Snd.netRipple();if(inGame)Snd.cheer(mine);
        const pos=isB?{x:C.HOOP.x,y:C.HOOP.y,z:C.HOOP.z}:{x:m.ball.x,y:1.2,z:C.HL};
        burst(pos,[KIT[e.by].main,KIT[e.by].trim,0xffffff],45,7,1.5,7);netKick=1;netWho=e.by;
        if(inGame)toast(e.how==='dunk'?'DUNK!':isB?'BUCKET!':'GOAL!',null,KIT[e.by].css);break;}
      case 'over':if(inGame){showOver(m);Snd.whistle(true);setTimeout(()=>Snd.cheer(true),500);}break;
    }
  }
  m.events.length=0;
}

/* ---------- camera: sits behind the controlled character; faces their target with the ball, faces the ball without it ---------- */
const camPos=new THREE.Vector3(0,14,30),camLook=new THREE.Vector3(),tmpV=new THREE.Vector3();
let defK=0,camTurning=false;
function updCamera(m,dt,snap){
  let defending=false;
  if(!human){   // attract orbit behind the menu
    const a=time*0.12;tmpV.set(Math.sin(a)*30,13,Math.cos(a)*34);camPos.lerp(tmpV,snap?1:Math.min(1,dt*2));
    tmpV.set(m.ball.x*0.4,1,m.ball.z*0.5);camLook.lerp(tmpV,snap?1:Math.min(1,dt*2));
  }else{
    const me=m.players[human],b=m.ball;let want=camYaw;
    if(b.owner===human||m.phase==='ready'||m.phase==='scored'){const tg=human==='B'?C.HOOP:{x:0,z:C.HL+3};
      const dx=tg.x-me.x,dz=tg.z-me.z;want=Math.hypot(dx,dz)>3?Math.atan2(dx,dz):(human==='B'?Math.PI:0);}
    else{const dx=b.x-me.x,dz=b.z-me.z;defending=true;if(Math.hypot(dx,dz)>2.6)want=Math.atan2(dx,dz);}
    let d=want-camYaw;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;
    // defending: the view holds still while the ball stays roughly ahead, so your stick directions stay put
    if(defending&&!snap){if(Math.abs(d)<0.3&&!camTurning)d=0;else camTurning=Math.abs(d)>0.06;}else camTurning=false;
    camYaw+=snap?d:d*Math.min(1,dt*(defending?2.4:3.2));
    const fx=Math.sin(camYaw),fz=Math.cos(camYaw),sp=Math.hypot(me.vx,me.vz);
    defK+=((defending?1:0)-defK)*(snap?1:Math.min(1,dt*3));
    const dist=7.6+2.6*defK+sp*0.12,hgt=4.3+1.9*defK+sp*0.05;
    tmpV.set(me.x-fx*dist,hgt,me.z-fz*dist);camPos.lerp(tmpV,snap?1:Math.min(1,dt*7));
    tmpV.set(me.x+fx*5,1.3+me.jump*0.4,me.z+fz*5);camLook.lerp(tmpV,snap?1:Math.min(1,dt*9));
  }
  camera.position.copy(camPos);camera.lookAt(camLook);
}

function openSettings(from){editFrom=from;editing=true;sel='stick';drag=null;input.jx=input.jy=0;
  $('menu').classList.add('hidden');$('paused').classList.add('hidden');hud.classList.remove('hidden');hud.classList.add('edit');$('settings').classList.remove('hidden');applyLayout();}
function closeSettings(){editing=false;drag=null;saveLayout();hud.classList.remove('edit');$('settings').classList.add('hidden');applyLayout();
  if(editFrom==='menu'){hud.classList.add('hidden');$('menu').classList.remove('hidden');}else $('paused').classList.remove('hidden');}
$('openSet').addEventListener('click',()=>openSettings('menu'));$('pSet').addEventListener('click',()=>openSettings('pause'));
$('szUp').addEventListener('click',()=>{lay[sel].s=Math.min(1.6,Math.round(lay[sel].s*10+1)/10);applyLayout();});
$('szDown').addEventListener('click',()=>{lay[sel].s=Math.max(0.7,Math.round(lay[sel].s*10-1)/10);applyLayout();});
$('lReset').addEventListener('click',()=>{lay=JSON.parse(JSON.stringify(DEF));applyLayout();});
$('lDone').addEventListener('click',closeSettings);
$('snd').addEventListener('click',()=>{Snd.setOn(!Snd.on);$('snd').textContent=Snd.on?'SOUND ON':'SOUND OFF';});

function resize(){   // the game is always landscape: on an upright screen the whole app is turned a quarter turn
  const W=window.innerWidth||1,H=window.innerHeight||1,app=$('app');rot=H>W;scrW=W;
  const w=rot?H:W,h=rot?W:H;
  app.style.width=w+'px';app.style.height=h+'px';app.style.left=rot?W+'px':'0';app.style.transform=rot?'rotate(90deg)':'none';
  app.classList.toggle('short',h<520);app.classList.toggle('tight',w<560);
  appW=w;appH=h;applyLayout();renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=58;if(titleOn)camera.fov=46;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

function frame(now){
  requestAnimationFrame(frame);
  const dt=last?Math.min(0.05,(now-last)/1000):STEP;last=now;
  if(paused){renderer.render(scene,camera);return;}
  time+=dt;acc+=dt;
  if(human)readInput(dt);
  tLights.forEach((l,i)=>{l.intensity=titleOn?[2.2,2.2,0.9][i]:0;});
  if(titleOn){titleShot(dt);updParts(dt);renderer.render(scene,camera);return;}
  let n=0;
  while(acc>=STEP&&n<4){
    simIn.shoot=input.shoot;simIn.tackle=input.tackle;simIn.barge=input.barge;input.shoot=input.tackle=input.barge=false;
    Sim.step(match,STEP,human?simIn:null);acc-=STEP;n++;
    if(!human&&match.phase==='over')match=Sim.create({human:null,tiers:{B:'medium',F:'medium'}});
  }
  if(n===4)acc=0;
  handleEvents(match);
  syncChar(match,chars.B,match.players.B,dt,time);syncChar(match,chars.F,match.players.F,dt,time);
  if(human&&Snd.ctx)footSounds(match);
  updCamera(match,dt,false);syncBall(match,dt);updParts(dt);
  // nets react to a score
  netKick=Math.max(0,netKick-dt*1.6);const wob=Math.sin(time*30)*netKick;
  arena.net.scale.set(1+wob*0.25,1+netKick*(netWho==='B'?0.5:0),1+wob*0.25);arena.gnet.scale.z=1+(netWho==='F'?netKick*0.5+wob*0.1:0);
  if(human){
    const me=match.players[human];meRing.visible=true;meRing.position.set(me.x,0.04,me.z);meRing.rotation.z=time*1.5;
    beacon.visible=true;const up=Math.sin(time*4)*0.2;
    if(human==='B')beacon.position.set(C.HOOP.x,C.HOOP.y+2.1+up,C.HOOP.z);else beacon.position.set(0,C.GOAL_H+1.4+up,C.HL);
    beacon.rotation.y=time*2;
    // defending aid: the lane from the ball carrier to the target you guard, and the spot on it to stand on
    const opp=match.players[human==='B'?'F':'B'],guard=human==='B'?{x:0,z:C.HL}:{x:C.HOOP.x,z:C.HOOP.z};
    if(match.ball.owner===opp.id&&match.phase==='play'){
      const dx=guard.x-opp.x,dz=guard.z-opp.z,L=Math.hypot(dx,dz)||1,g=Math.min(1.9,L*0.6);
      lane.visible=true;lane.position.set(opp.x+dx/2,0.05,opp.z+dz/2);lane.rotation.y=Math.atan2(dx,dz);lane.scale.set(0.22,1,L);
      spot.visible=true;spot.position.set(opp.x+dx/L*g,0.06,opp.z+dz/L*g);const onIt=Math.hypot(me.x-spot.position.x,me.z-spot.position.z)<1;
      spot.material.color.set(onIt?0x35c274:0xffffff);spot.scale.setScalar(1+Math.sin(time*6)*0.08);
    }else{lane.visible=false;spot.visible=false;}
    drawRadar(match);if((pctTick=(pctTick+1)%4)===0)updHud(match);
  }else{meRing.visible=false;beacon.visible=false;lane.visible=false;spot.visible=false;}
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
